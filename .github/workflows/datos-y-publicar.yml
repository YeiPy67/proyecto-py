name: Datos y publicación

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"    # precios cada 30 minutos
    - cron: "15 */3 * * *"    # noticias cada 3 horas
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: proyecto-py
  cancel-in-progress: false

jobs:
  datos:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Precios
        run: python3 pipeline/datos.py --solo-precios
      - name: Noticias (cada 3 horas)
        if: github.event.schedule == '15 */3 * * *' || github.event_name == 'workflow_dispatch'
        run: python3 pipeline/datos.py --solo-noticias
      - name: Contenido y calendarios
        run: python3 pipeline/armar.py
      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          git diff --cached --quiet || (git commit -m "Datos actualizados" && git push)

  publicar:
    needs: [datos]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4

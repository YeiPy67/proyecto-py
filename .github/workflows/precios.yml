name: Precios y publicación

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: precios
  cancel-in-progress: true

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Precios
        if: github.event_name != 'push'
        run: python3 pipeline/datos.py --solo-precios
      - name: Contenido y calendarios
        run: python3 pipeline/armar.py
      - name: Guardar datos
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          git diff --cached --quiet && exit 0
          git commit -m "Precios actualizados"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - uses: actions/deploy-pages@v4
